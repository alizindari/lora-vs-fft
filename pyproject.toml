[project]
name = "lora-vs-fft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.49.0",
    "datasets>=2.16.0",
    "peft>=0.14.0",
    "deepspeed>=0.15.0",
    "accelerate>=1.3.0",
    "safetensors",
    "numpy",
    "scipy",
    "matplotlib",
    "lm-eval>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
